spring:
  application:
    name: system-admin-service
  datasource:
    url: jdbc:postgresql://localhost:5432/system_admin_db
    username: auth_user
    password: auth_pass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

# JWT validation — use auth-service's RSA public key
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      secret-key: ${JWT_SECRET_KEY:your-256-bit-secret-key-change-in-production}
      issuer: auth-service
      clock-skew-seconds: 60

logging:
  level:
    com.ntt.sysadmin: DEBUG
