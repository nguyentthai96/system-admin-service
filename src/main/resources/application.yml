spring:
  application:
    name: system-admin-service
  docker:
    compose:
      enabled: false

  config:
    import:
      # Base-core shared config (logging, filter chain, security, observability, etc.)
      - classpath:application-base-core.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/system_admin_db
    username: auth_user
    password: auth_pass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

# ── System-admin-service overrides ──────────────────────────────────
logging:
  level:
    com.ntt.sysadmin: DEBUG
    com.ntt.sysadminservice: DEBUG

management:
  metrics:
    tags:
      application: system-admin-service

# ── Spring Modulith Event Outbox ────────────────────────────────────
spring.modulith:
  republish-outstanding-events-on-restart: true
